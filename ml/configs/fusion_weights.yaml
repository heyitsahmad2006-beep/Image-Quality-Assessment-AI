# Quality Score Fusion Weights & Penalty Rules
# Defines how classical OpenCV metrics and AI model predictions are combined into the overall quality score (0-100)

defect_weights:
  blur: 0.20
  glare: 0.12
  darkness: 0.12
  overexposure: 0.12
  motion_artifacts: 0.15
  occlusion: 0.12
  poor_framing: 0.10
  low_resolution: 0.07

ai_vs_heuristic_ratio:
  ai_weight: 0.65
  heuristic_weight: 0.35

resolution_thresholds:
  min_megapixels_good: 1.0
  min_megapixels_acceptable: 0.3
  min_dimension_good: 720

suitability_thresholds:
  not_suitable_max: 24.99
  needs_improvement_max: 49.99
  suitable_max: 74.99
  highly_suitable_min: 75.0
